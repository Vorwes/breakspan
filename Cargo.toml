[workspace]
members = ["crates/breakspan-core", "crates/breakspan-otlp", "crates/breakspan-store", "crates/breakspan-cli", "crates/breakspan-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Vorwes/breakspan"

[workspace.dependencies]
breakspan-core = { path = "crates/breakspan-core" }
breakspan-store = { path = "crates/breakspan-store" }
breakspan-otlp = { path = "crates/breakspan-otlp" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
