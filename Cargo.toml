[workspace]
members = ["crates/breakspan-core", "crates/breakspan-otlp", "crates/breakspan-store", "crates/breakspan-cli", "crates/breakspan-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Vorwes/breakspan"

[workspace.dependencies]
breakspan-core = { path = "crates/breakspan-core" }
breakspan-store = { path = "crates/breakspan-store" }
breakspan-otlp = { path = "crates/breakspan-otlp" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
prost = { version = "0.14", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Mechanical enforcement of AGENTS.md rules; CI denies warnings. Test exemptions
# live in clippy.toml.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
